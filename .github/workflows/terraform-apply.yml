name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente para aplicar manualmente"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: prod

permissions:
  contents: read
  id-token: write

jobs:
  # prod aplica automaticamente em todo push em main que toque infra/**,
  # e também via "Run workflow" escolhendo prod.
  apply-prod:
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    uses: ./.github/workflows/reusable/terraform.yml
    with:
      environment: production
      label: prod
      working-directory: infra/environments/prod
      action: apply
    secrets:
      aws-role-arn: ${{ secrets.AWS_ROLE_ARN_PROD }}
      aws-region: ${{ secrets.AWS_REGION }}
      jwt-secret-key: ${{ secrets.TF_VAR_JWT_SECRET_KEY }}

  # dev/staging só aplicam manualmente via "Run workflow".
  apply-dev:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev'
    uses: ./.github/workflows/reusable/terraform.yml
    with:
      environment: development
      label: dev
      working-directory: infra/environments/dev
      action: apply
    secrets:
      aws-role-arn: ${{ secrets.AWS_ROLE_ARN_DEV }}
      aws-region: ${{ secrets.AWS_REGION }}
      jwt-secret-key: ${{ secrets.TF_VAR_JWT_SECRET_KEY }}

  apply-staging:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'
    uses: ./.github/workflows/reusable/terraform.yml
    with:
      environment: staging
      label: staging
      working-directory: infra/environments/staging
      action: apply
    secrets:
      aws-role-arn: ${{ secrets.AWS_ROLE_ARN_STAGING }}
      aws-region: ${{ secrets.AWS_REGION }}
      jwt-secret-key: ${{ secrets.TF_VAR_JWT_SECRET_KEY }}
