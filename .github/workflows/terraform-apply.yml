name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente para aplicar manualmente"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: prod

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    strategy:
      fail-fast: false
      matrix:
        include:
          # auto: true roda automaticamente em todo push em main que toque infra/**
          # (comportamento idêntico ao atual). Dev/staging só aplicam via
          # "Run workflow" até existir uma branch/gatilho de auto-apply para eles.
          - label: prod
            environment: production
            role-secret: AWS_ROLE_ARN_PROD
            auto: true
          - label: dev
            environment: development
            role-secret: AWS_ROLE_ARN_DEV
            auto: false
          - label: staging
            environment: staging
            role-secret: AWS_ROLE_ARN_STAGING
            auto: false
    if: >
      (github.event_name == 'push' && matrix.auto == true) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == matrix.label)
    uses: ./.github/workflows/reusable/terraform.yml
    with:
      environment: ${{ matrix.environment }}
      label: ${{ matrix.label }}
      working-directory: infra/environments/${{ matrix.label }}
      action: apply
    secrets:
      aws-role-arn: ${{ secrets[matrix.role-secret] }}
      aws-region: ${{ secrets.AWS_REGION }}
      jwt-secret-key: ${{ secrets.TF_VAR_JWT_SECRET_KEY }}
