name: Chat CI

on:
  push:
    branches:
      - main
      - development
    paths:
      - "app/**"
      - "tests/**"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: chat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    uses: ./.github/workflows/reusable/dotnet-ci.yml
    with:
      working-directory: .
      solution-file: ChatApp.slnx
