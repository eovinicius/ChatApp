name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente para rodar o plan manualmente"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: prod

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  plan:
    strategy:
      fail-fast: false
      matrix:
        include:
          # auto: true roda automaticamente em todo PR que toque infra/**.
          # dev/staging ficam disponíveis via "Run workflow" até os secrets
          # AWS_ROLE_ARN_DEV / AWS_ROLE_ARN_STAGING existirem — quando existirem,
          # basta trocar `auto: false` para `auto: true` abaixo, sem reescrever o workflow.
          # `environment` é o nome do GitHub Environment (protection rules) — mantido
          # igual ao usado hoje em produção ("production") para não perder proteções já
          # configuradas; `label` é só o nome curto usado em infra/environments/<label>.
          - label: prod
            environment: production
            role-secret: AWS_ROLE_ARN_PROD
            auto: true
          - label: dev
            environment: development
            role-secret: AWS_ROLE_ARN_DEV
            auto: false
          - label: staging
            environment: staging
            role-secret: AWS_ROLE_ARN_STAGING
            auto: false
    if: >
      (github.event_name == 'pull_request' && matrix.auto == true) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == matrix.label)
    uses: ./.github/workflows/reusable/terraform.yml
    with:
      environment: ${{ matrix.environment }}
      label: ${{ matrix.label }}
      working-directory: infra/environments/${{ matrix.label }}
      action: plan
    secrets:
      aws-role-arn: ${{ secrets[matrix.role-secret] }}
      aws-region: ${{ secrets.AWS_REGION }}
      jwt-secret-key: ${{ secrets.TF_VAR_JWT_SECRET_KEY }}
