name: Chat CD

on:
  workflow_run:
    workflows: ["Chat CI"]
    types:
      - completed
    branches:
      - main
      - development

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: development
            environment-name: development
            ecr-repository: chatapp-dev
            ecs-cluster: chatapp-dev
            ecs-service: chatapp-dev
            role-secret: AWS_ROLE_ARN_DEV
          - branch: main
            environment-name: production
            ecr-repository: chatapp-prod
            ecs-cluster: chatapp-prod
            ecs-service: chatapp-prod
            role-secret: AWS_ROLE_ARN_PROD
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == matrix.branch
    uses: ./.github/workflows/reusable/docker-cd.yml
    with:
      dockerfile: apps/chat-service/src/Chat.Api/Dockerfile
      context: .
      ecr-repository: ${{ matrix.ecr-repository }}
      ecs-cluster: ${{ matrix.ecs-cluster }}
      ecs-service: ${{ matrix.ecs-service }}
      environment-name: ${{ matrix.environment-name }}
      sha: ${{ github.event.workflow_run.head_sha }}
    secrets:
      aws-role-arn: ${{ secrets[matrix.role-secret] }}
      aws-region: ${{ secrets.AWS_REGION }}
